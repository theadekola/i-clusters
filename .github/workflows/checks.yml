name: Application and installer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Ubuntu shell syntax
        run: |
          bash -n apps/api/src/agent-assets/install-node-agent.sh
          bash -n apps/api/src/agent-assets/install-docker-agent.sh
          python3 apps/api/test/node-agent-python.test.py
          node deployment/check-release.mjs
          node --check deployment/check-docker-crash-recovery.mjs
          if node deployment/acceptance-gate.mjs docs/acceptance-record.example.json > /dev/null; then
            echo "An unreviewed acceptance template must not pass."
            exit 1
          fi
          bash -n install.sh
          bash -n deployment/iclusters-updater
          bash -n deployment/setup-updater.sh
          bash deployment/test-updater.sh
          bash -n deployment/iclusters
          bash -n deployment/upgrade.sh deployment/controller-backup.sh deployment/controller-restore.sh deployment/check-controller-recovery.sh
          python3 deployment/test-configure-https.py
          python3 deployment/test-trusted-https.py
          python3 deployment/test-apple-trust-profile.py
          python3 deployment/test-brand-migration.py
          bash -n deployment/finish-brand-migration.sh
          python3 deployment/test-safe-extract.py
          sudo bash deployment/test-upgrade.sh
          bash -n deployment/build-env.sh
          bash -n deployment/network.sh
          bash deployment/test-network.sh
          sh -n deployment/generate-secrets.sh
          bash deployment/test-controller-source.sh
          bash install.sh --help
      - name: Check actual guest LVM report schemas (read-only)
        run: |
          if ! command -v lvs >/dev/null || ! command -v pvs >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y lvm2
          fi
          sudo python3 apps/api/test/guest-storage-report.test.py
      - name: Check private secret generation
        run: |
          sh deployment/generate-secrets.sh
          test "$(stat -c %a .env)" = 600
          if sh deployment/generate-secrets.sh; then exit 1; fi
          docker compose config --quiet
          rm .env
      - run: npm ci --workspaces=false
        working-directory: apps/api
      - run: npm test --workspaces=false
        working-directory: apps/api
      - run: npm ci --workspaces=false
        working-directory: apps/web
      - run: npm test --workspaces=false
        working-directory: apps/web
      - run: npm run build --workspaces=false
        working-directory: apps/web
      - name: Verify popup layouts in Chromium
        run: |
          npm install --prefix /tmp/iclusters-browser-tools --no-save --ignore-scripts playwright-core@1.62.1 @sparticuz/chromium@153.0.0
          ICLUSTERS_BROWSER_TOOLS=/tmp/iclusters-browser-tools/node_modules node apps/web/scripts/check-dashboard-recovery.mjs
          ICLUSTERS_BROWSER_TOOLS=/tmp/iclusters-browser-tools/node_modules node apps/web/scripts/check-popup-layout.mjs
          ICLUSTERS_BROWSER_TOOLS=/tmp/iclusters-browser-tools/node_modules LAYOUT_PRODUCTION=1 LAYOUT_CHECK_TYPOGRAPHY=1 LAYOUT_WIDTHS=1280,768,390,320 node apps/web/scripts/audit-layout.mjs
      - name: Check SSH pairing and confirmation dialogs on desktop and mobile
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout "$RUNNER_TEMP/pairing.key" -out "$RUNNER_TEMP/pairing.crt"
          ICLUSTERS_BROWSER_TOOLS=/tmp/iclusters-browser-tools/node_modules LAYOUT_PRODUCTION=1 LAYOUT_CONNECTION_CHOICES=1 LAYOUT_ROUTES=/settings LAYOUT_WIDTHS=1280,390,320 LAYOUT_HTTPS_KEY="$RUNNER_TEMP/pairing.key" LAYOUT_HTTPS_CERT="$RUNNER_TEMP/pairing.crt" node apps/web/scripts/audit-layout.mjs
      - name: Check cluster switching on desktop and mobile
        run: ICLUSTERS_BROWSER_TOOLS=/tmp/iclusters-browser-tools/node_modules LAYOUT_PRODUCTION=1 LAYOUT_ROUTES=/proxmox LAYOUT_WIDTHS=1280,390,320 LAYOUT_CLUSTER_SWITCH=1 node apps/web/scripts/audit-layout.mjs
      - name: Exercise live language switching on desktop and mobile
        run: ICLUSTERS_BROWSER_TOOLS=/tmp/iclusters-browser-tools/node_modules LAYOUT_PRODUCTION=1 LAYOUT_ROUTES=/ LAYOUT_WIDTHS=1280,390 LAYOUT_CHECK_LANGUAGES=1 node apps/web/scripts/audit-layout.mjs
      - name: Save popup layout screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: popup-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/iclusters-popup-layout
          if-no-files-found: ignore
      - name: Build and start the deployment
        run: |
          sh deployment/generate-secrets.sh > /dev/null
          source deployment/build-env.sh
          # Reproduce hardened deployment checkouts whose public files are owner-only.
          chmod 600 apps/web/public/manifest.webmanifest apps/web/public/sw.js apps/web/public/assets/iclusters-*.png
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > /tmp/iclusters-ci-root.crt
          curl --fail --show-error --cacert /tmp/iclusters-ci-root.crt https://localhost:6002/api/health
          mkdir -p "$RUNNER_TEMP/cluster-test-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout "$RUNNER_TEMP/cluster-test-tls/key.pem" -out "$RUNNER_TEMP/cluster-test-tls/cert.pem"
          docker compose run --rm --no-deps -T -e ICLUSTERS_TEST_TLS_DIR=/tmp/cluster-test-tls -v "$RUNNER_TEMP/cluster-test-tls:/tmp/cluster-test-tls:ro" -v "$PWD/apps/api/test:/app/test:ro" api sh -c 'OWNER_SETUP_TEST_DATABASE_URL="$DATABASE_URL" node --test test/owner-setup-postgres.test.js test/guest-restarts.test.js test/multi-cluster.test.js'
          NODE_EXTRA_CA_CERTS=/tmp/iclusters-ci-root.crt node deployment/check-registration.mjs
          NODE_EXTRA_CA_CERTS=/tmp/iclusters-ci-root.crt node deployment/check-mobile-assets.mjs
          NODE_EXTRA_CA_CERTS=/tmp/iclusters-ci-root.crt node deployment/check-browser-certificate.mjs
      - name: Check deployed Caddy security dependencies
        run: |
          docker compose exec -T caddy caddy list-modules | grep -Fx 'dns.providers.cloudflare'
          docker compose exec -T caddy caddy build-info > /tmp/iclusters-caddy-build-info.txt
          grep -E '[[:space:]]github.com/go-jose/go-jose/v4[[:space:]]+v4\.1\.6([[:space:]]|$)' /tmp/iclusters-caddy-build-info.txt
          grep -E '[[:space:]]golang.org/x/net[[:space:]]+v0\.62\.0([[:space:]]|$)' /tmp/iclusters-caddy-build-info.txt
      - name: Disposable Docker worker crash recovery
        run: |
          ICLUSTERS_CI_DRILL=1 ICLUSTERS_DRILL_IMAGE="$(docker image inspect --format '{{.Id}}' "$(docker compose images -q api | head -1)")" node deployment/check-docker-crash-recovery.mjs
      - name: Encrypted controller recovery drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          sudo env ICLUSTERS_CI_DRILL=1 bash deployment/check-controller-recovery.sh
      - name: Dependency security and component inventory
        run: |
          npm audit --omit=dev --audit-level=high --workspaces=false --prefix apps/api
          npm audit --omit=dev --audit-level=high --workspaces=false --prefix apps/web
          (cd apps/api && npm sbom --omit=dev --workspaces=false --package-lock-only --sbom-format=cyclonedx > /tmp/iclusters-api-sbom.json)
          (cd apps/web && npm sbom --omit=dev --workspaces=false --package-lock-only --sbom-format=cyclonedx > /tmp/iclusters-web-sbom.json)
      - name: Collect component and image identities
        id: images
        run: |
          mkdir -p artifacts/evidence
          cp /tmp/iclusters-*-sbom.json /tmp/iclusters-caddy-build-info.txt artifacts/evidence/
          echo "api=$(docker compose images -q api | head -1)" >> "$GITHUB_OUTPUT"
          mapfile -t images < <(for service in api web caddy postgres; do docker compose images -q "$service"; done)
          docker image inspect --format '{{json .}}' "${images[@]}" | jq -s 'map({Id,RepoTags,RepoDigests,Architecture,Os,Created})' > artifacts/evidence/image-identities.json
      - name: Install scanner and record API image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.images.outputs.api }}
          scanners: vuln
          format: json
          output: artifacts/evidence/api-initial-scan.json
          exit-code: '0'
          timeout: 10m
      - name: Scan all runtime images and gate fixable high severity findings
        run: |
          result=0
          for service in api web caddy postgres; do
            image=$(docker compose images -q "$service" | head -1)
            test -n "$image" || exit 1
            trivy image --scanners vuln --format json --output "artifacts/evidence/$service-vulnerabilities.json" --timeout 10m "$image" || result=1
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --timeout 10m "$image" || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: artifacts/evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Deployment logs and cleanup
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose logs --tail=100
            docker compose down --volumes
          fi

  release:
    needs: checks
    # Publication paused until final fixes and acceptance testing are complete.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: artifacts/evidence
      - name: Publish the reviewed version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo 'Use a reviewed semantic version or release candidate.'; exit 1; }
          tag="v$version"
          notes="docs/releases/$tag.md"
          test -s "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; its tag and assets were not changed."
            exit 0
          fi
          git archive --format=tar.gz --prefix="iclusters-$version/" "$GITHUB_SHA" > "artifacts/evidence/iclusters-$version.tar.gz"
          (cd artifacts/evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          node deployment/release-notes.mjs "$notes" "$GITHUB_REPOSITORY" "$tag" /tmp/iclusters-release-notes.md
          release_flags=()
          if [[ $version == *-rc.* ]]; then release_flags+=(--prerelease); fi
          gh release create "$tag" artifacts/evidence/* --target "$GITHUB_SHA" --title "i-Clusters $version" --notes-file /tmp/iclusters-release-notes.md "${release_flags[@]}"
