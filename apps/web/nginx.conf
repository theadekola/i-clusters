server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # iOS may discover the standard root icon separately from the manifest.
  # Serve the existing public PNG, never the SPA HTML fallback at these paths.
  location = /apple-touch-icon.png {
    add_header Cache-Control "no-cache" always;
    try_files /assets/iclusters-180.png =404;
  }
  location = /apple-touch-icon-precomposed.png {
    add_header Cache-Control "no-cache" always;
    try_files /assets/iclusters-180.png =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # Revalidate the application shell and recovery tools after an upgrade.
  location = /sw.js { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location = /connection-check.html { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location = /connection-check.js { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  # Missing versioned chunks must be a 404, not a successful HTML response.
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
